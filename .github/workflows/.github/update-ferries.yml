name: Update Halifax Ferry Board

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  update-ferries:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update Halifax ferry departures
        run: python update-ferries.py

      - name: Commit and push updated ferry data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ferries.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Halifax ferry departures"
            git push
          fi
